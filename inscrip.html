<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfinity – Inscription</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="Perfinity_vf_claire-removebg-preview.png">
</head>
<body>

  <!-- HEADER -->
  <header>
    <img src="Perfinity_vf_claire-removebg-preview.png" alt="Perfinity" class="logo">
    <nav>
      <ul>
        <li><a href="home.html">Accueil</a></li>
        <li><a href="cata.html">Catalogue de cours</a></li>
        <li><a href="qui.html">Quizz</a></li>
        <li><a href="tdb.html">Tableau de bord</a></li>
        <li><a href="inscrip.html" class="active">Inscription</a></li>
        <li><a href="log.html">Connexion</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="auth-page">
      <div class="auth-card">

        <div class="auth-logo">
          <img src="Perfinity_vf_claire-removebg-preview.png" alt="Perfinity">
        </div>
        <h1 class="auth-title">Créer un compte</h1>
        <p class="auth-subtitle">Rejoins Perfinity et commence à apprendre dès aujourd'hui.</p>

        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" placeholder="Ton prénom" required>
          </div>
          <div class="form-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" placeholder="Ton nom de famille" required>
          </div>
          <div class="form-group">
            <label for="email">Adresse email</label>
            <input type="email" id="email" placeholder="exemple@email.com" required>
          </div>
          <div class="form-group">
            <label for="mdp">Mot de passe</label>
            <input type="password" id="mdp" placeholder="Minimum 8 caractères" minlength="8" required>
          </div>
          <div class="form-group">
            <label for="mdp2">Confirmer le mot de passe</label>
            <input type="password" id="mdp2" placeholder="Répète ton mot de passe" required>
          </div>

          <div id="errorMsg" style="display:none;background:#fee2e2;color:#b91c1c;padding:.75rem 1rem;border-radius:var(--radius);font-size:.88rem;margin-bottom:1rem;font-family:var(--font-ui);font-weight:600;"></div>
          <div id="successMsg" style="display:none;background:#dcfce7;color:#15803d;padding:.75rem 1rem;border-radius:var(--radius);font-size:.88rem;margin-bottom:1rem;font-family:var(--font-ui);font-weight:600;"></div>

          <button type="submit" class="btn btn-primary" style="width:100%;font-size:1rem;padding:.85rem">
            S'inscrire
          </button>
        </form>

        <div class="form-divider">ou</div>

        <div class="auth-switch">
          Déjà un compte ? <a href="log.html">Se connecter</a>
        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Perfinity. Tous droits réservés.</p>
    <div class="rslinks">
      <a href="https://www.tiktok.com/@immybloom26" target="_blank">
        <img src="styles/LogoTikTok.jpg" alt="TikTok">
      </a>
      <a href="https://www.instagram.com/immyb_loom/" target="_blank">
        <img src="styles/logoInsta.jpg" alt="Instagram">
      </a>
    </div>
  </footer>

  <script>
    function handleRegister(e) {
      e.preventDefault();
      const mdp  = document.getElementById('mdp').value;
      const mdp2 = document.getElementById('mdp2').value;
      const err  = document.getElementById('errorMsg');
      const ok   = document.getElementById('successMsg');

      err.style.display = 'none';
      ok.style.display  = 'none';

      if (mdp !== mdp2) {
        err.textContent  = 'Les mots de passe ne correspondent pas.';
        err.style.display = 'block';
        return;
      }

      ok.textContent  = '✅ Compte créé avec succès ! Redirection en cours…';
      ok.style.display = 'block';
      setTimeout(() => window.location.href = 'log.html', 2000);
    }
  </script>

</body>
</html>
